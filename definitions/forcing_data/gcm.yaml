- specifier: gcm_climate_atmosphere
  group: gcm-forcing
  title: GCM-based atmospheric forcing
  status: mandatory
  doi:
  path:
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/picontrol/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-picontrol/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/historical/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-historical/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/scen7-vl/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-scen7-vl/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/scen7-h/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-scen7-h/
  comment: >-
    Input dataset documentation → [EC-Earth3-ESM-1-1](https://www.isimip.org/gettingstarted/input-data-bias-adjustment)
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - agriculture
  - biodiversity
  - biomes
  - coastal
  - diarrhea
  - energy_demand
  - fire
  - forestry
  - health
  - labour
  - lakes_global
  - lakes_local
  - peat
  - permafrost
  - water_global
  - water_regional
  - water_quality

- specifier: gcm_climate_atmosphere_local
  group: gcm-forcing
  title: Local atmospheric climate forcing for lake locations
  status: mandatory
  doi:
  path:
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/picontrol/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-picontrol/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/historical/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-hist/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/scen7-vl/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-scen7-vl/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/scen7-h/
  - ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/esm-scen7-h/
  comment: >-
    Extractions of grid cell data from global atmospheric climate forcing. See list
    of lakes sites [here](https://www.isimip.org/gettingstarted/input-data-bias-adjustment/).
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - lakes_local

