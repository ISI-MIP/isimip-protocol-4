- specifier: default
  description: >-
    For all experiments other than the sensitivity experiments.

- specifier: 1901co2
  description: >-
    **CO₂ concentration fixed at 1901 levels** as a deviation from the `obsclim` climate
    + CO₂ forcing.
  simulation_rounds:
  - ISIMIP4a
  sectors:
  - agriculture
  - biomes
  - coastal
  - diarrhea
  - energy_demand
  - fire
  - forestry
  - groundwater
  - health
  - labour
  - lakes_global
  - lakes_local
  - peat
  - permafrost
  - water_global
  - water_regional

- specifier: obsco2
  description: >-
    **Observation-based CO₂ concentration** (as in `obsclim`) used with `counterclim`
    atmospheric forcing.
  simulation_rounds:
  - ISIMIP4a
  sectors:
  - biomes
  - fire
  - forestry
  - peat
  - permafrost

- specifier: nowatermgt
  description: >-
    **No water management** (e.g. no human water abstraction, no reservoirs) while other
    direct human forcings such as land use changes are considered according to `histsoc`
    or `2021soc`.
  simulation_rounds:
  - ISIMIP4a
  sectors:
  - groundwater
  - water_global
  - water_regional

- specifier: 1901irr
  description: >-
    **Fixed year-1901 irrigation areas and water use efficiencies** but representation
    of other direct human influences such as land use changes according to `histsoc`.
    This experiment is related to the IRRMIP initiative.
  simulation_rounds:
  - ISIMIP4a
  sectors:
  - water_global
  - water_regional

- specifier: nofire
  description: >-
    Simulation with **fire switched off** to identify impact of fire within the model.
  simulation_rounds:
  - ISIMIP4a
  - ISIMIP4b
  sectors:
  - biomes
  - fire
  - peat
  - permafrost

- specifier: 2021co2
  description: >-
    CO₂ concentration fixed at 2021 levels.
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - agriculture
  - biomes
  - coastal
  - diarrhea
  - fire
  - forestry
  - fs-n
  - groundwater
  - health
  - labour
  - lakes_global
  - lakes_local
  - marine-fishery_global
  - marine-fishery_regional
  - peat
  - permafrost
  - water_global
  - water_regional
  - water_quality

- specifier: extrasoc
  description: >-
    Simulations with **additional direct human forcings**, such as desalination, inter-basin water transfer,
    and irrigation techniques share datasets.
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - water_global
  group3: true

- specifier: vlndep
  description: >-
    Nitrogen deposition according to the **Very Low emission scenario**.
  simulation_rounds:
  - ISIMIP4b
  products:
  - SecondaryOutputData
  sectors:
  - biomes

- specifier: hndep
  description: >-
    Nitrogen deposition according to **High emission scenario**.
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - biomes

- specifier: nondep
  description: >-
    No nitrogen cycling.
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - biomes

- specifier: nondep2021co2
  description: >-
    No nitrogen cycling and CO₂ concentration fixed at 2021 levels.
  simulation_rounds:
  - ISIMIP4b
  sectors:
  - biomes
