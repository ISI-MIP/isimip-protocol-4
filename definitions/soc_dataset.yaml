    long_name: irrigated temperate cereals, spring wheat
    units: '1'
  - specifier: temperate_cereals_swh_rainfed
    long_name: rainfed temperate cereals, spring wheat
    units: '1'
  - specifier: temperate_cereals_wwh_irrigated
    long_name: irrigated temperate cereals, winter wheat
    units: '1'
  - specifier: temperate_cereals_wwh_rainfed
    long_name: rainfed temperate cereals, winter wheat
    units: '1'
  comment: >-
    Annual grid-cell fractions of the seasonal sub-splits of two landuse-15crops groups: temperate_cereals into winter wheat, spring wheat and a non-wheat residual (GGCMI phase-3 winter/spring wheat mask), and rice into rice1/rice2 seasons (GGCMI phase-3 crop calendar). Both splits sum exactly to their landuse-15crops parent totals, which are not repeated here. Fractions are of the whole grid cell, not land area. 2021soc holds the 2021 state fixed across the full 1850-2025 period, including the 1850-1900 spin-up; 2021soc under ISIMIP4a differs from 2021soc under ISIMIP4b, a future-window baseline.
