- specifier: era5
  description: >-
    Refers to ERA5 data used for the bias-correction globally on a 0.5° grid.

- specifier: w5e5
  description: >-
    Refers to W5E5 data used for the bias-correction globally on a 0.5° grid.

- specifier: nobasd
  description: >-
    Indicates that no bias correction was performed on the climate data (e.g. ocean
    data).
