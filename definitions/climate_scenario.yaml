- specifier: obsclim
  description: >-
    Observation-based climate related forcing.
  simulation_rounds:
  - ISIMIP4a

- specifier: counterclim
  description: >-
    De-trended climate related forcing, assuming the historical 1901 value of 296.13ppm
    for the CO₂ concentration and 928.80 ppb for the CH₄ concentration for the full
    period.
  description_note: >-
    **We are still working on the generation of the counterfactual version of the observational atmospheric forcings
    that will enable the counterfactual climate impact model simulations dedicated to climate impact attribution.**
  simulation_rounds:
  - ISIMIP4a
  sectors:
  - agriculture
  - biodiversity
  - biomes
  - diarrhea
  - fire
  - forestry
  - groundwater
  - health
  - coastal
  - labour
  - lakes_global
  - lakes_local
  - peat
  - permafrost
  - water_global
  - water_quality
  - water_regional

- specifier: ctrlclim
  simulation_rounds:
  - ISIMIP4a
  products:
  - InputData
  - SecondaryInputData

- specifier: spinclim
  simulation_rounds:
  - ISIMIP4a
  products:
  - InputData

- specifier: transclim
  simulation_rounds:
  - ISIMIP4a
  products:
  - InputData
  - SecondaryInputData

- specifier: picontrol
  specifier_alias:
  - picontrol
  - esm-picontrol
  description: >-
    GCM-based **pre-industrial climate related forcing**, CO₂ and CH₄ concentrations fixed
    at 1850 levels.
  description_note: >-
    We follow the CMIP7 vocabulary and label the concentration driven runs
    `picontrol` and the emission driven runs `esm-picontrol`.
  simulation_rounds:
  - ISIMIP4b

- specifier: historical
  specifier_alias:
  - historical
  - esm-hist
  description: >-
    GCM-based **historical climate related forcing**, historical changes in CO₂ and CH₄
    concentrations.
  description_note: >-
    We follow the CMIP7 vocabulary and label the concentration driven runs
    `histocical` and the emission driven runs `esm-hist`.
  simulation_rounds:
  - ISIMIP4b

- specifier: vl
  specifier_alias:
  - scen7-vl
  - esm-scen7-vl
  description: >-
    GCM-based climate related forcing according to the **very low emission scenario**.
  description_note: >-
    We follow the CMIP7 vocabulary and label the concentration driven runs
    `scen7-vl` and the emission driven runs `esm-scen7-vl`.
  simulation_rounds:
  - ISIMIP4b

- specifier: h
  specifier_alias:
  - scen7-h
  - esm-scen7-h
  description: >-
    GCM-based climate related forcing according to the **high emission scenario**.
  description_note: >-
    We follow the CMIP7 vocabulary and label the concentration driven runs
    `scen7-h` and the emission driven runs `esm-scen7-h`.
  simulation_rounds:
  - ISIMIP4b
