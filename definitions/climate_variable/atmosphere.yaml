- specifier: hurs
  long_name: Near-Surface Relative Humidity
  group: atmospheric-variables
  mandatory: true
  units: '%'
  frequency: daily
  resolution: 0.5° grid
  path:
    ISIMIP4a: ISIMIP4a/InputData/climate/atmosphere/<climate-scenario>/global/daily/historical/<climate-forcing>/<climate-forcing>_<climate-scenario>_hurs_global_<start_year>_<end_year>.nc
    ISIMIP4b: ISIMIP4b/InputData/climate/atmosphere/bias-adjusted/global/daily/<climate-scenario>/<climate-forcing>/<climate-forcing>_r1i1p1f1_w5e5_<climate-scenario>_hurs_global_daily_<start_year>_<end_year>.nc
  comment:
    ISIMIP4a: Input dataset documentation → [GSWP3-ERA5](https://www.isimip.org/gettingstarted/input-data-bias-adjustment)
    ISIMIP4b: Input dataset documentation → [EC-Earth3-ESM-1-1](https://www.isimip.org/gettingstarted/input-data-bias-adjustment)
  sectors:
  - agriculture
  - biodiversity
  - biomes
  - coastal
  - diarrhea
  - energy_demand
  - fire
  - forestry
  - groundwater
  - health
  - fs-n
  - labour
  - lakes_global
  - lakes_local
  - peat
  - permafrost
  - water_global
  - water_regional
  - water_quality
  climate_forcing:
    ISIMIP4a:
    - GSWP3-ERA5
    ISIMIP4b:
    - EC-Earth3-ESM-1-1

