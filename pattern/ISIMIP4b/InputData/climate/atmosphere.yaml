path: >-
  (?P<simulation_round>(ISIMIP4b))
  /(?P<product>(InputData))
  /(?P<category>(climate))
  /(?P<subcategory>(atmosphere))
  /(bias-adjusted|uncorrected)
  /(?P<region>(global))
  /(?P<time_step>(daily))
  /(?P<climate_scenario>[a-z0-9-]+)
  /(?P<climate_forcing>[A-Za-z0-9-]+)

dataset: >-
  (?P<climate_forcing>[a-z0-9-]+)
  _(?P<ensemble_member>[a-z0-9]+)
  _(?P<bias_adjustment>(era5|nobasd))
  _(?P<climate_scenario>[a-z0-9-]+)
  _(?P<climate_variable>[a-z]+)
  _(?P<resolution>[a-z0-9]+)
  _(?P<region>(global))
  _(?P<time_step>(daily))

file: >-
  (?P<climate_forcing>[a-z0-9-]+)
  _(?P<ensemble_member>[a-z0-9]+)
  _(?P<bias_adjustment>(era5|nobasd))
  _(?P<climate_scenario>[a-z0-9-]+)
  _(?P<climate_variable>[a-z]+)
  _(?P<resolution>[a-z0-9]+)
  _(?P<region>(global))
  _(?P<time_step>(daily))
  _(?P<start_year>\d{4})
  _(?P<end_year>\d{4})
