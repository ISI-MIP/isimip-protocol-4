path: >-
  (?P<simulation_round>(ISIMIP4b))
  /(?P<product>(InputData))
  /(?P<category>(socioeconomic))
  /(?P<subcategory>(reservoirs_dams))
  /(?P<soc_scenario>[a-z0-9-]+)

dataset: >-
  (?P<soc_dataset>[a-z0-9-]+)
  (_(?P<model>(watergap2-2e)))?
  (_(?P<climate_forcing>(gswp3-w5e5)))?
  (_(?P<soc_scenario>(histsoc|2021soc|1850soc)))?
  (_(?P<soc_pathway>ssp\d))?

file: >-
  (?P<soc_dataset>[a-z0-9-]+)
  (_(?P<model>(watergap2-2e)))?
  (_(?P<climate_forcing>(gswp3-w5e5)))?
  (_(?P<soc_scenario>(histsoc|2021soc|1850soc)))?
  (_(?P<soc_pathway>ssp\d))?
  _(?P<start_year>\d{4})
  _(?P<end_year>\d{4})

suffix:
- .xlsx
- .csv
