path: >-
  (?P<simulation_round>(ISIMIP4a))
  /(?P<product>(InputData))
  /(?P<category>(socioeconomic))
  /(?P<subcategory>(gdp))
  /(?P<soc_scenario>[a-z0-9-]+)

dataset: >-
  (?P<soc_dataset>[a-z0-9-]+)
  _(?P<soc_scenario>[a-z0-9]+)
  _(?P<resolution>[a-z0-9]+)
  _(?P<time_step>[a-z]+)

file: >-
  (?P<soc_dataset>[a-z0-9-]+)
  _(?P<soc_scenario>[a-z0-9]+)
  _(?P<resolution>[a-z0-9]+)
  _(?P<time_step>[a-z]+)
  _(?P<start_year>\d{4})
  _(?P<end_year>\d{4})

suffix:
- .csv
- .nc
