path: >-
  (?P<simulation_round>(ISIMIP4a))
  /(?P<product>(InputData))
  /(?P<category>(climate))
  /(?P<subcategory>(atmosphere_composition))
  /(?P<climate_variable>[a-z0-9-]+)
  /(?P<climate_scenario>[a-z]+)

dataset: >-
  (?P<climate_variable>[a-z0-9-]+)
  _(?P<climate_scenario>[a-z0-9]+)
  _(?P<time_step>[a-z]+)

file: >-
  (?P<climate_variable>[a-z0-9-]+)
  _(?P<climate_scenario>[a-z0-9]+)
  _(?P<time_step>[a-z]+)
  _(?P<start_year>\d{4})
  _(?P<end_year>\d{4})

suffix:
- .txt
